# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/' # Location of package manifests
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'eslint'
        versions:
          - '>=10'
    open-pull-requests-limit: 10
    groups:
      react-stack:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      next-stack:
        patterns:
          - 'next'
          - 'eslint-config-next'
      auth-stack:
        patterns:
          - '@clerk/nextjs'
      database-stack:
        patterns:
          - '@neondatabase/serverless'
          - 'drizzle-orm'
          - 'drizzle-kit'
      ui-stack:
        patterns:
          - '@radix-ui/*'
          - 'class-variance-authority'
          - 'clsx'
          - 'lucide-react'
          - 'next-themes'
          - 'tailwind-merge'
          - 'tailwindcss'
          - '@tailwindcss/postcss'
          - 'tw-animate-css'
      testing-stack:
        patterns:
          - '@testing-library/*'
      vitest-stack:
        patterns:
          - 'vitest'
          - '@vitest/coverage-v8'
      playwright-stack:
        patterns:
          - '@playwright/test'
      tooling-stack:
        patterns:
          - '@types/node'
          - 'esbuild'
          - 'tsx'
          - 'typescript'
          - 'p-limit'
      vercel-stack:
        patterns:
          - '@vercel/analytics'
          - '@vercel/blob'
          - '@vercel/speed-insights'
