name: Meticulous

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: meticulous-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meticulous:
    name: Meticulous
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --build-arg DATABASE_URL=${{ secrets.DATABASE_URL }} -t sharedjournal-meticulous:${{ github.sha }} .

      - name: Run Meticulous tests
        uses: alwaysmeticulous/report-diffs-action/upload-container@v1
        with:
          api-token: ${{ secrets.METICULOUS_API_TOKEN }}
          image-tag: sharedjournal-meticulous:${{ github.sha }}
          container-port: 3000
          container-env: |
            NODE_ENV=production
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            ENTRY_CONTENT_ENCRYPTION_KEY=${{ secrets.ENTRY_CONTENT_ENCRYPTION_KEY }}
