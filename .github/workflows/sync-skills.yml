name: Sync SKILL docs to agents folder

on:
  push:
    paths:
      - '.github/skills/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync skills
        run: |
          set -euo pipefail
          mkdir -p .agents/skills
          changed=0
          for src in .github/skills/*.md; do
            [ -f "$src" ] || continue
            base=$(basename "$src" .md)
            target_dir=".agents/skills/$base"
            mkdir -p "$target_dir"
            target_file="$target_dir/SKILL.md"

            # Build frontmatter safely using printf (avoid heredoc issues)
            SRC_NAME=$(basename "$src")
            BASE_NAME="$base"
            BASE_NAME_LOWER=$(echo "$base" | tr '[:upper:]' '[:lower:]')

            printf '%s\n' "---" \
              "name: \"$BASE_NAME\"" \
              "description: \"Synced from .github/skills/$SRC_NAME\"" \
              "applyTo:" \
              "  - $BASE_NAME_LOWER" \
              "version: \"1.0\"" \
              "---" > "$target_file"

            # Append the original markdown content
            echo >> "$target_file"
            cat "$src" >> "$target_file"

            git add "$target_file"
            changed=1
          done

          if [ "$changed" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "chore: sync skills from .github/skills to .agents/skills [skip ci]" || true
              git push
            fi 
          else
            echo "No skill files found to sync"
          fi
